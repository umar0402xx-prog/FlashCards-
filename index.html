<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Level Recall</title>
<meta name="description" content="Spaced-repetition flashcards for Cambridge A Level Physics, Chemistry and Biology.">
<meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1020" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="main" class="wrap" aria-live="polite">
    <p class="muted">Loading your cards…</p>
  </main>
</div>

<nav id="nav" class="nav" aria-label="Main">
  <div class="nav-in">
    <button type="button" class="nav-btn" data-action="go" data-view="today" id="nav-today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Today</span>
    </button>
    <button type="button" class="nav-btn" data-action="go" data-view="cards" id="nav-cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/></svg>
      <span>Cards</span>
    </button>
    <button type="button" class="nav-btn" data-action="go" data-view="add" id="nav-add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Add</span>
    </button>
    <button type="button" class="nav-btn" data-action="go" data-view="settings" id="nav-settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Settings</span>
    </button>
  </div>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-panel"></div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<noscript><p class="wrap">This app needs JavaScript turned on.</p></noscript>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/auto-render.min.js"></script>
<script src="vendor/katex/contrib/mhchem.min.js"></script>
<script src="app.js"></script>
</body>
</html>
